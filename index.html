}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.btn {

      (o ? '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + r + '" fill="#000" opacity="' + o + '"/>' : '');
  }
  function H(x, y, w, h, r) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + r + '" fill="#fff" opacity=".2"/>'; }
  function SEAM(x1, x2, y) { return '<path d="M' + x1 + ' ' + y + 'H' + x2 + '" stroke="#000" stroke-opacity=".16" stroke-width="1.5" fill="none"/>'; }
  function G(rot, cx, cy, inner) { return '<g transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')">' + inner + '</g>'; }
  function svg(inner) { return '<svg viewBox="0 0 200 160" role="img" focusable="false">' + SHADOW + inner + '</svg>'; }

  var ART = {
    transf: svg(B(40, 52, 56, 48, 14, .1) + B(104, 52, 56, 48, 14, .1) + B(10, 46, 40, 60, 18) + B(150, 46, 40, 60, 18) +
      B(14, 94, 172, 50, 12) + H(18, 96, 164, 14, 8) + SEAM(14, 186, 122) +
      G(-8, 74, 84, B(58, 70, 32, 28, 7)) + G(9, 128, 84, B(112, 72, 30, 26, 7))),
    bed2: svg(B(22, 34, 156, 70, 14, .08) + B(10, 46, 34, 98, 14) + B(156, 46, 34, 98, 14) +
      B(34, 92, 132, 52, 14) + H(38, 94, 124, 14, 8) + SEAM(34, 166, 120) +
      G(-6, 72, 78, B(54, 66, 36, 24, 10)) + G(7, 130, 76, B(112, 64, 36, 24, 10))),
    bed3: svg(B(20, 52, 50, 54, 13, .08) + B(75, 44, 50, 62, 13, .08) + B(130, 52, 50, 54, 13, .08) + B(168, 66, 22, 46, 8) +
      B(8, 98, 184, 46, 10) + H(12, 100, 176, 12, 6) + SEAM(8, 192, 122)),
    chbed: svg(B(50, 46, 100, 48, 10, .1) + B(38, 88, 124, 56, 10) + H(42, 90, 116, 14, 6) + SEAM(38, 162, 118) +
      G(-7, 100, 76, B(70, 58, 60, 36, 8))),
    pear: svg(
      '<path d="M100 12C152 12 178 70 171 112C167 142 138 150 100 150C62 150 33 142 29 112C22 70 48 12 100 12Z" fill="var(--c)"' + ST + '/>' +
      '<path d="M100 14C94 60 94 104 100 149" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="1.5"/>' +
      '<path d="M40 112C50 140 150 140 160 112C150 150 50 150 40 112Z" fill="#000" opacity=".1"/>' +
      '<ellipse cx="74" cy="56" rx="20" ry="11" transform="rotate(-28 74 56)" fill="#fff" opacity=".22"/>'),
    kids: svg(
      '<g transform="translate(100 150) scale(.66) translate(-100 -150)">' +
      '<path d="M100 12C152 12 178 70 171 112C167 142 138 150 100 150C62 150 33 142 29 112C22 70 48 12 100 12Z" fill="var(--c)"' + ST + '/>' +
      '<path d="M100 14C94 60 94 104 100 149" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="2"/>' +
      '<ellipse cx="74" cy="56" rx="20" ry="11" transform="rotate(-28 74 56)" fill="#fff" opacity=".22"/></g>'),
    beanSofa: svg(
      '<path d="M14 124C6 72 26 28 70 24L130 24C174 28 194 72 186 124C184 144 164 150 100 150C36 150 16 144 14 124Z" fill="var(--c)"' + ST + '/>' +
      '<path d="M40 112C58 92 142 92 160 112C152 138 48 138 40 112Z" fill="#fff" opacity=".2"/>' +
      '<path d="M40 112C58 92 142 92 160 112" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="1.5"/>' +
      '<path d="M14 124C20 146 60 150 100 150C140 150 180 146 186 124C176 142 24 142 14 124Z" fill="#000" opacity=".1"/>' +
      '<ellipse cx="64" cy="48" rx="26" ry="11" fill="#fff" opacity=".22"/>'),
    cube: svg(
      '<path d="M38 82C38 62 52 56 100 56C148 56 162 62 162 82L162 130C162 146 150 150 100 150C50 150 38 146 38 130Z" fill="var(--c)"' + ST + '/>' +
      '<path d="M44 78C44 66 60 61 100 61C140 61 156 66 156 78C156 90 140 95 100 95C60 95 44 90 44 78Z" fill="#fff" opacity=".2"/>' +
      '<path d="M38 130C38 146 50 150 100 150C150 150 162 146 162 130C150 140 50 140 38 130Z" fill="#000" opacity=".1"/>'),
    round: svg(
      '<path d="M44 70L44 128C44 146 70 150 100 150C130 150 156 146 156 128L156 70Z" fill="var(--c)"' + ST + '/>' +
      '<path d="M44 128C44 146 70 150 100 150C130 150 156 146 156 128C140 138 60 138 44 128Z" fill="#000" opacity=".1"/>' +
      '<ellipse cx="100" cy="70" rx="56" ry="20" fill="var(--c)"' + ST + '/>' +
      '<ellipse cx="100" cy="70" rx="56" ry="20" fill="#fff" opacity=".2"/>'),
    flat: svg(
      '<path d="M30 108L30 126C30 142 62 150 100 150C138 150 170 142 170 126L170 108Z" fill="var(--c)"' + ST + '/>' +
      '<path d="M30 126C30 142 62 150 100 150C138 150 170 142 170 126C150 136 50 136 30 126Z" fill="#000" opacity=".1"/>' +
      '<ellipse cx="100" cy="108" rx="70" ry="22" fill="var(--c)"' + ST + '/>' +
      '<ellipse cx="100" cy="108" rx="70" ry="22" fill="#fff" opacity=".2"/>')
  };

  /* ---------- catalog ---------- */
  var PRODUCTS = [
    { id: "transf", cat: "sofa", name: { kk: "Диван-трансформер", ru: "Диван-трансформер" },
      text: { kk: "Жазылып, толыққанды ұйықтайтын орынға айналады. Жиегінде жұмсақ валиктер мен жастықтар бар.", ru: "Раскладывается в полноценное спальное место. По краям мягкие валики и подушки." } },
    { id: "bed2", cat: "sofa", name: { kk: "Диван-төсек, 2 орындық", ru: "Диван-кровать двухместный" },
      text: { kk: "Биік арқасы бар ықшам диван. Жазғанда ұйықтайтын орын болады.", ru: "Компактный диван с высокой спинкой. В разложенном виде спальное место." } },
    { id: "bed3", cat: "sofa", name: { kk: "Диван-төсек, 3 орындық", ru: "Диван-кровать трёхместный" },
      text: { kk: "Үш үлкен жастығы бар кең диван. Қонаққа да, күнделікті демалуға да жарайды.", ru: "Широкий диван с тремя большими подушками. Подходит и гостям, и для ежедневного отдыха." } },
    { id: "chbed", cat: "chair", name: { kk: "Кресло-төсек", ru: "Кресло-кровать" },
      text: { kk: "Бір адамға арналған жиналмалы кресло. Жазылса төсекке айналады.", ru: "Складное кресло на одного. Раскладывается в кровать." } },
    { id: "pear", cat: "bag", name: { kk: "Кресло-мешок «Груша»", ru: "Кресло-мешок «Груша»" },
      text: { kk: "Денеңіздің пішінін қабылдайтын жұмсақ қаңқасыз кресло.", ru: "Мягкое бескаркасное кресло, принимает форму тела." } },
    { id: "kids", cat: "bag", name: { kk: "Балалар кресло-мешогі", ru: "Детское кресло-мешок" },
      text: { kk: "Кішкентай өлшемді жұмсақ кресло, балалар бөлмесіне арналған.", ru: "Небольшое мягкое кресло для детской комнаты." } },
    { id: "beanSofa", cat: "bag", name: { kk: "Диван-мешок", ru: "Диван-мешок" },
      text: { kk: "Кең әрі жайлы қаңқасыз диван. Демалуға, фильм көруге ыңғайлы.", ru: "Просторный бескаркасный диван для отдыха и фильмов." } },
    { id: "cube", cat: "pouf", name: { kk: "Пуф-куб", ru: "Пуф-куб" },
      text: { kk: "Отыруға да, аяқ қоюға да жарайтын төртбұрышты пуф.", ru: "Квадратный пуф: можно сидеть или поставить ноги." } },
    { id: "round", cat: "pouf", name: { kk: "Дөңгелек пуф", ru: "Круглый пуф" },
      text: { kk: "Бөлмеге жинақы келетін дөңгелек пуф.", ru: "Аккуратный круглый пуф для любой комнаты." } },
    { id: "flat", cat: "pouf", name: { kk: "Пуф-таблетка", ru: "Пуф-таблетка" },
      text: { kk: "Аласа әрі кең пуф. Қонақтарға қосымша орын болады.", ru: "Низкий и широкий пуф. Дополнительное место для гостей." } }
  ];
  var CATS = ["all", "sofa", "chair", "bag", "pouf"];

  /* ---------- state ---------- */
  var S = { lang: "kk", cat: "all", hero: DEFAULT_COLOR, colors: {}, cart: [], name: "", note: "" };
  PRODUCTS.forEach(function (p) { S.colors[p.id] = DEFAULT_COLOR; });

  function load() {
    try {
      var l = localStorage.getItem("ardea-lang"); if (l === "kk" || l === "ru") S.lang = l;
      var c = JSON.parse(localStorage.getItem("ardea-cart") || "[]");
      if (Array.isArray(c)) S.cart = c.filter(function (it) { return byId(it.id) && COLORS[it.ci] && it.q > 0; });
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem("ardea-lang", S.lang); localStorage.setItem("ardea-cart", JSON.stringify(S.cart)); } catch (e) {}
  }
  function byId(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
  function tr(k) { return T[S.lang][k]; }
  function cname(i) { return COLORS[i][S.lang === "kk" ? 0 : 1]; }
  function $(s) { return document.querySelector(s); }

  /* ---------- render ---------- */
  function swatchHtml(attr, current) {
    return COLORS.map(function (c, i) {
      return '<button class="sw" type="button" style="--sw:' + c[2] + '" ' + attr + ' data-i="' + i + '" aria-label="' + cname(i) + '" title="' + cname(i) + '" aria-pressed="' + (i === current) + '"></button>';
    }).join("");
  }

  function renderHero() {
    $("#hero-art").innerHTML = ART.transf;
    $(".stage").style.setProperty("--c", COLORS[S.hero][2]);
    $(".hero").style.setProperty("--c", COLORS[S.hero][2]);
    $("#hero-color-name").textContent = cname(S.hero);
    $("#hero-sw").innerHTML = swatchHtml('data-hero', S.hero);
    $("#hero-sw").setAttribute("aria-label", tr("pickAll"));
  }

  function renderTabs() {
    $("#tabs").innerHTML = CATS.map(function (c) {
      return '<button class="tab" type="button" data-cat="' + c + '" aria-pressed="' + (c === S.cat) + '">' + tr(c) + '</button>';
    }).join("");
  }

  function renderGrid() {
    var list = PRODUCTS.filter(function (p) { return S.cat === "all" || p.cat === S.cat; });
    $("#grid").innerHTML = list.map(function (p) {
      var ci = S.colors[p.id];
      return '<article class="card" data-card="' + p.id + '" style="--c:' + COLORS[ci][2] + '">' +
        '<div class="pic" aria-hidden="true">' + ART[p.id] + '</div>' +
        '<div class="body"><h3>' + p.name[S.lang] + '</h3><p>' + p.text[S.lang] + '</p>' +
        '<div class="colorline"><span class="dot"></span><span>' + tr("color") + ': <b data-cname>' + cname(ci) + '</b></span></div>' +
        '<div class="swatches" role="group" aria-label="' + tr("color") + '">' + swatchHtml('data-card-sw="' + p.id + '"', ci) + '</div>' +
        '<button class="btn" type="button" data-add="' + p.id + '">' + tr("add") + '</button></div></article>';
    }).join("");
  }

  function updateCard(id) {
    var card = $('[data-card="' + id + '"]');
    if (!card) return;
    var ci = S.colors[id];
    card.style.setProperty("--c", COLORS[ci][2]);
    card.querySelector("[data-cname]").textContent = cname(ci);
    card.querySelectorAll(".sw").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.i === ci)); });
  }

  function count() { return S.cart.reduce(function (n, it) { return n + it.q; }, 0); }

  function orderText() {
    var lines = [tr("greet")];
    S.cart.forEach(function (it, n) {
      lines.push((n + 1) + ". " + byId(it.id).name[S.lang] + " — " + cname(it.ci) + " — " + it.q + " " + tr("pcs"));
    });
    if (S.name.trim()) lines.push(tr("nameL") + ": " + S.name.trim());
    if (S.note.trim()) lines.push(tr("noteL") + ": " + S.note.trim());
    return lines.join("\n");
  }

  function renderCart() {
    $("#badge").textContent = count();
    var empty = S.cart.length === 0;
    $("#cart-form").hidden = empty;
    $("#cart-foot").hidden = empty;
    $("#cart-list").innerHTML = empty ? '<p class="empty">' + tr("empty") + '</p>' :
      S.cart.map(function (it, k) {
        var p = byId(it.id);
        return '<div class="item"><div class="thumb" style="--c:' + COLORS[it.ci][2] + '" aria-hidden="true">' + ART[it.id] + '</div>' +
          '<div><h3>' + p.name[S.lang] + '</h3>' +
          '<div class="col"><span class="dot" style="background:' + COLORS[it.ci][2] + '"></span>' + cname(it.ci) + '</div>' +
          '<div class="ctl"><div class="qty"><button type="button" data-dec="' + k + '" aria-label="−">−</button><span>' + it.q + '</span><button type="button" data-inc="' + k + '" aria-label="+">+</button></div>' +
          '<button class="link" type="button" data-del="' + k + '">' + tr("remove") + '</button></div></div></div>';
      }).join("");
    if (!empty) $("#send").href = WA + "?text=" + encodeURIComponent(orderText());
  }

  function applyLang() {
    document.documentElement.lang = S.lang === "kk" ? "kk" : "ru";
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = tr(el.dataset.t); });
    document.querySelectorAll("[data-th]").forEach(function (el) { el.innerHTML = tr(el.dataset.th); });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)); });
    renderHero(); renderTabs(); renderGrid(); renderCart();
  }

  /* ---------- actions ---------- */
  function copyText(text, btn, fallback) {
    var old = btn.textContent;
    var done = function (ok) {
      btn.textContent = ok ? tr("copied") : fallback;
      setTimeout(function () { btn.textContent = old; }, 2200);
    };
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); }
    catch (e) { done(false); }
  }

  function openCart() { $("#sheet").hidden = false; document.body.style.overflow = "hidden"; $("#close-cart").focus(); }
  function closeCart() { $("#sheet").hidden = true; document.body.style.overflow = ""; $("#open-cart").focus(); }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var el;
    if ((el = t.closest("[data-lang]"))) { S.lang = el.dataset.lang; save(); applyLang(); return; }
    if ((el = t.closest("[data-hero]"))) {
      S.hero = +el.dataset.i;
      PRODUCTS.forEach(function (p) { S.colors[p.id] = S.hero; updateCard(p.id); });
      renderHero(); return;
    }
    if ((el = t.closest("[data-card-sw]"))) { S.colors[el.dataset.cardSw] = +el.dataset.i; updateCard(el.dataset.cardSw); return; }
    if ((el = t.closest("[data-cat]"))) { S.cat = el.dataset.cat; renderTabs(); renderGrid(); return; }
    if ((el = t.closest("[data-add]"))) {
      var id = el.dataset.add, ci = S.colors[id];
      var f = S.cart.filter(function (it) { return it.id === id && it.ci === ci; })[0];
      if (f) f.q += 1; else S.cart.push({ id: id, ci: ci, q: 1 });
      save(); renderCart();
      el.textContent = tr("added");
      setTimeout(function () { el.textContent = tr("add"); }, 1400);
      return;
    }
    if ((el = t.closest("[data-inc]"))) { S.cart[+el.dataset.inc].q += 1; save(); renderCart(); return; }
    if ((el = t.closest("[data-dec]"))) {
      var it = S.cart[+el.dataset.dec]; it.q -= 1;
      if (it.q <= 0) S.cart.splice(+el.dataset.dec, 1);
      save(); renderCart(); return;
    }
    if ((el = t.closest("[data-del]"))) { S.cart.splice(+el.dataset.del, 1); save(); renderCart(); return; }
    if (t.closest("#open-cart")) { openCart(); return; }
    if (t.closest("[data-close]")) { closeCart(); return; }
    if (t.closest("#copy-order")) { copyText(orderText(), $("#copy-order"), orderText()); return; }
    if ((el = t.closest("[data-copy-phone]"))) { copyText(PHONE, el, "8 771 138 60 57"); return; }
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#sheet").hidden) closeCart(); });
  $("#ord-name").addEventListener("input", function (e) { S.name = e.target.value; renderCart(); });
  $("#ord-note").addEventListener("input", function (e) { S.note = e.target.value; renderCart(); });

  load();
  applyLang();
})();
</script>

</body></html>
